<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>Join as Staff – Expo Connect</title></head><body data-page="join"><div id="hdr"></div>
<div class="page-h"><div class="wrap"><h1>Join as event staff</h1><p>Profile ek baar banao, har event ke liye apply karo.</p></div></div>
<section><div class="wrap"><p id="jobNote" class="meta" style="margin-bottom:14px"></p>
<form data-endpoint="/api/register"><div class="row"><div><label for="n">Full name</label><input id="n" name="name" required></div><div><label for="p">WhatsApp number</label><input id="p" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required></div></div>
<div class="row"><div><label for="e">Email (optional)</label><input id="e" name="email" type="email"></div><div><label for="a">Age</label><input id="a" name="age" type="number" min="18" max="60" required></div></div>
<div><label>Preferred venues</label><div class="chk"><label><input type="checkbox" name="venues" value="Pragati Maidan">Pragati Maidan, Delhi</label><label><input type="checkbox" name="venues" value="India Expo Mart">India Expo Mart, Greater Noida</label><label><input type="checkbox" name="venues" value="Yashobhoomi">Yashobhoomi, Delhi</label></div></div>
<div class="row"><div><label for="r">Role you want</label><select id="r" name="role"><option>Hostess</option><option>Promoter</option><option>Setup Crew</option><option>Registration Desk</option><option>Any</option></select></div><div><label for="x">Experience</label><select id="x" name="experience"><option>Fresher</option><option>1–2 events</option><option>3+ events</option></select></div></div>
<div><label for="av">Availability</label><input id="av" name="availability" placeholder="e.g. weekends, full-time, after 4 PM"></div>
<div style="margin:12px 0"><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="consent" required style="width:auto;margin-top:4px"><span>Main 18+ hu aur <a href="privacy-policy.html" target="_blank">Privacy Policy</a> aur <a href="terms.html" target="_blank">Terms</a> se sehmat hu.</span></label></div>
<div class="msg" id="ok" role="status">Registration mil gaya. Team jaldi aapse WhatsApp par contact karegi.</div>
<button class="btn btn-n" type="submit">Register</button></form></div></section>
<div id="ftr"></div><script src="js/main.js"></script></body></html>
